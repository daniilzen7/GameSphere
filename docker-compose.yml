services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gamesphere
      POSTGRES_USER: gamesphere
      POSTGRES_PASSWORD: gamesphere
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamesphere"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/gamesphere
      DB_USERNAME: gamesphere
      DB_PASSWORD: gamesphere
      JWT_SECRET: ${JWT_SECRET:-defaultSecretKeyForDevelopmentOnlyMustBeAtLeast256BitsLong!!}
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      API_URL: http://server:8080
    depends_on:
      - server

volumes:
  pgdata:
