databaseChangeLog:
  - changeSet:
      id: 003-create-halls
      author: gamesphere
      changes:
        - createTable:
            tableName: halls
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: is_active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

  - changeSet:
      id: 003-create-game-tables
      author: gamesphere
      changes:
        - createTable:
            tableName: game_tables
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: hall_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: label
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: seats
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: is_active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: game_tables
            baseColumnNames: hall_id
            referencedTableName: halls
            referencedColumnNames: id
            constraintName: fk_game_tables_hall
