        - name: notification_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Поставлено в очередь
          content:
            application/json:
              example:
                success: true
                message: "Уведомление поставлено на повторную отправку"
                data:
                  notification_id: "ntf-002"
                  status: "queued"
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Уже отправлено
          content:
